  <script>
    (function () {
      const P = '#sealed-';
      const tl = gsap.timeline({ paused: true });
      const spray = (sel, at, d = 0.2) => tl.fromTo(sel, { clipPath: 'inset(0 100% 0 0)' }, { clipPath: 'inset(0 0% 0 0)', duration: d, ease: 'none' }, at);
      const camAt = (px, py, s) => ({ x: 960 - px * s, y: 540 - py * s, scale: s });

      // state carried from the containment: doors shut, host cordoned, guests failed over to hall D
      tl.set(P + 'cam', camAt(470, 470, 2.3), 0);
      tl.set([P + 'doorL', P + 'doorR'], { y: 0 }, 0);
      tl.set(P + 'cordon', { opacity: 1 }, 0);
      tl.set(P + 'hot', { fill: '#FF5A1F' }, 0);
      tl.set(P + 'flood', { attr: { r: 300 } }, 0);
      tl.set(P + 'mgmtpath', { strokeDashoffset: 1300 }, 0);
      document.querySelectorAll('.sealed-guest').forEach((g, i) => {
        const tx = 1223 + (i % 4) * 20, ty = 303 + Math.floor(i / 4) * 20;
        tl.set(g, { x: tx - +g.getAttribute('x'), y: ty - +g.getAttribute('y'), fill: '#2FBF71' }, 0);
      });
      tl.fromTo(P + 'band', { x: -860 }, { x: 0, duration: 0.45, ease: 'expo.out' }, 0);
      // the quarantine plate drops onto the host and the flood drains back into it
      tl.fromTo(P + 'qplate', { opacity: 0, y: -160 }, { opacity: 1, y: 0, duration: 0.24, ease: 'power4.in' }, 0.01);

      tl.set(P + 'lab', { opacity: 0 }, 0);
      tl.set(P + 'lab', { opacity: 1 }, 0.2);
      spray(P + 'lab', 0.2, 0.2);
      tl.fromTo({ n: 0 }, { n: 0 }, { n: 9.4, duration: 1.4, ease: 'expo.out', onUpdate() { document.querySelector(P + 'num').textContent = this.targets()[0].n.toFixed(1); } }, 1.23);
      tl.fromTo(P + 'num', { opacity: 0 }, { opacity: 1, duration: 0.1 }, 1.23);
      tl.set(P + 'sec', { opacity: 0 }, 0);
      tl.set(P + 'sec', { opacity: 1 }, 2.28);
      spray(P + 'sec', 2.28, 0.2);
      tl.set(P + 'zero', { opacity: 0 }, 0);
      tl.set(P + 'zero', { opacity: 1 }, 3.2);
      spray(P + 'zero', 3.2, 0.3);
      tl.fromTo(P + 'demo', { opacity: 0 }, { opacity: 0.55, duration: 0.3 }, 3.45);
