  <script>
    (function () {
      const P = '#breach-';
      const tl = gsap.timeline({ paused: true });
      const spray = (sel, at, d = 0.2) => tl.fromTo(sel, { clipPath: 'inset(0 100% 0 0)' }, { clipPath: 'inset(0 0% 0 0)', duration: d, ease: 'none' }, at);
      const camAt = (px, py, s) => ({ x: 960 - px * s, y: 540 - py * s, scale: s });

      tl.set(P + 'cam', { ...camAt(650, 360, 9), opacity: 0 }, 0);
      tl.set([P + 'doorL', P + 'doorR'], { y: -70 }, 0);
      tl.set([P + 'cordon', P + 'qplate', P + 'title', P + 'band'], { opacity: 0 }, 0);
      tl.fromTo(P + 'band', { opacity: 0, y: 80 }, { opacity: 1, y: 0, duration: 0.5, ease: 'expo.out' }, 2.07);
      ['c1', 'a1', 'c2', 'a2', 'c3', 'a3', 'c4', 'susp'].forEach((id) => tl.set(P + id, { opacity: 0 }, 0));
      // the agent turns and pushes through its wall
      tl.to(P + 'agent', { fill: '#FF5A1F', duration: 0.12, ease: 'none' }, 0.73);
      tl.to(P + 'agent', { x: 370, rotation: 12, transformOrigin: '50% 50%', duration: 0.42, ease: 'power4.in' }, 0.93);
      tl.set(P + 'title', { opacity: 1 }, 0.98);
      spray(P + 'title', 0.98, 0.25);
      tl.fromTo(P + 'crate', { x: 0 }, { x: 10, duration: 0.03, yoyo: true, repeat: 3, ease: 'none' }, 1.35);
      // pull back out to the ship: the crate shrinks into its cell, and the flood starts
      tl.to(P + 'title', { opacity: 0, filter: 'blur(8px)', duration: 0.2, ease: 'power3.in' }, 1.82);
      tl.to(P + 'crate', { scale: 0.02, opacity: 0, duration: 0.5, ease: 'power3.in', transformOrigin: '50% 50%' }, 1.82);
      tl.to(P + 'cam', { opacity: 1, duration: 0.2 }, 1.87);
      tl.to(P + 'cam', { ...camAt(760, 470, 1.75), duration: 0.8, ease: 'expo.out' }, 2.02);
      tl.set(P + 'hot', { fill: '#FF5A1F' }, 0);
      tl.fromTo(P + 'flood', { attr: { r: 0 } }, { attr: { r: 150 }, duration: 3.08, ease: 'power1.in' }, 2.17);
      tl.set(P + 'susp', { opacity: 0.6 }, 2.14);
      spray(P + 'susp', 2.14, 0.25);
      // the chain lights as the voice names it
      [['c1', 2.53], ['a1', 3.05], ['c2', 3.56], ['a2', 3.837], ['c3', 3.957], ['a3', 3.95], ['c4', 4.81]].forEach(([id, at]) => {
        tl.set(P + id, { opacity: 1 }, at);
        spray(P + id, at, 0.16);
      });
      tl.to(P + 'host', { x: -3, duration: 0.04, yoyo: true, repeat: 5, ease: 'none' }, 5.07);
      window.__timelines['breach'] = tl;
    })();
