<!doctype html>
<html lang="en" data-resolution="landscape" data-composition-variables='[
  {"id":"color-ground","type":"color","label":"Steel","default":"#C8CBC6"},
  {"id":"color-ink","type":"color","label":"Stencil ink","default":"#121417"},
  {"id":"color-accent","type":"color","label":"Safety orange","default":"#FF5A1F"},
  {"id":"color-sealed","type":"color","label":"Sealed green","default":"#2FBF71"}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      /*COMMON*/
      :root { --color-ground: #C8CBC6; --color-ink: #121417; --color-accent: #FF5A1F; --color-sealed: #2FBF71; --panel: #0E0F12; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--color-ground); }
      #root { width: 100%; height: 100%; position: relative; font-family: 'Big Shoulders', sans-serif; }
      #steel { position: absolute; inset: 0; background: var(--color-ground); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="__TOTAL__" data-width="1920" data-height="1080">
      <div id="steel"></div>
<!--SCENES-->
      <audio id="vo" class="clip" data-start="0" data-track-index="10" data-volume="1" src="assets/audio/vo.mp3"></audio>
      <audio id="music" class="clip" data-start="0" data-duration="__TOTAL__" data-track-index="11" data-volume="0.5" src="assets/audio/music.mp3"></audio>
<!--SFX-->
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
