<template>
  <!-- FOOTAGE beat (v3): the real product on the wallpaper in a device frame with glass chrome; the camera pushes in on
       what the line names. Works with a STILL now and a recorded CLIP later: edit film.config.mjs only.
       Params (scenes[].params). Every `t` / `at` / `until` is a time spec timed() resolves (local s | "phrase" | {phrase, offset}):
         shots:    [{src, t?}]            stills (png/jpg), each shown from its t (the first from 0); a swap is a match cut
         clip:     {src, map?, from?, rate?}  a recording instead of stills (assets/clips/<name>.mp4, muted).
                   map: [[t, clipT], ...] piecewise-linear clip time (scene t -> clip t); one <video> per segment
         cam:      [{t, home} | {t, u, v, z, d?, ease?, fx?, fy?}]  (u, v) = 0..1 of the footage put at frame (fx, fy=500)
         focus:    [{t, until?, u0, v0, u1, v1, hot?}]  a ring around a footage rect (drawn at a constant on-screen weight)
         callouts: [{t, until?, u, v, text, side?, tone?, len?}]
         cursor:   [{t, u, v, click?}]   stills only: a recorded clip carries its own cursor
         flash:    [{t, u0, v0, u1, v1}]  a pressed button lights for 0.2 s
         keys:     {at, t, labels: ["⌘", "↵"], y?}   keycaps land at `at`, press at `t` (frame coordinates)
         tag:      "Demo data" (a small glass label, top left), tagUntil?
         title:    window title text
       Transitions: S.in / S.out from the config; an outgoing zoom may name `target: {u0, v0, u1, v1, r}` (footage rect),
       which is converted to the frame rect at the cut from the camera keys. -->
  <style>
    /*COMMON*/
    #{{P}}over { position: absolute; inset: 0; pointer-events: none; }
    #{{P}}tag { left: 48px; top: 30px; }
  </style>
  {{ (() => {
    const L = { x: 200, y: 64, w: 1520, bar: 40 };
    L.sh = L.w / 1.6; L.h = L.sh + L.bar;
    globalThis.__fl = L;
    // the camera scale in force at local time t (keys after timed())
    globalThis.__zAt = (keys, t) => { let z = 1; for (const k of keys || []) if (k.t <= t + 1e-6) z = k.home ? 1 : (k.z ?? 1); return z; };
    return '';
  })() }}
  <div id="root" data-composition-id="{{ID}}" data-width="1920" data-height="1080">
    <div id="{{P}}stage" class="stage">
      <!--KIT:wallpaper-->
      <div id="{{P}}whip" class="whip"><div id="{{P}}settle" class="settle">
        <div id="{{P}}cam" class="cam">
          <div id="{{P}}dev" class="device" style="left:{{__fl.x}}px; top:{{__fl.y}}px; width:{{__fl.w}}px; height:{{__fl.h}}px;">
            <div class="dev-bar"><div class="dev-lights"><i></i><i></i><i></i></div>{{ p.title ? `<div class="dev-title" data-layout-ignore>${esc(p.title)}</div>` : '' }}</div>
            <div id="{{P}}screen" class="dev-screen">
{{ (() => {
  const out = [];
  if (p.clip) {
    // map pairs [sceneT, clipT, src?]: piecewise-linear clip time; a pair at the same scene time as the one before it is a
    // jump cut (a third element switches the source from there on). FILM_CLIPS=proxy builds against assets/clips/proxy/.
    const c = timed(p.clip);
    const prox = (s) => (process.env.FILM_CLIPS === 'proxy' ? s.replace('assets/clips/', 'assets/clips/proxy/') : s);
    const map = (c.map && c.map.length ? c.map : [[0, c.from ?? 0]]).map((m) => [m[0] === 'end' ? D : m[0] === 'cut' ? CUT : T(m[0]), +m[1], m[2] || null]);
    let src = c.src, last = c.rate ?? 1, n = 0;
    for (let i = 0; i < map.length; i++) {
      const [t0, c0, s] = map[i];
      if (s) src = s;
      const next = map[i + 1];
      const t1 = next ? next[0] : D;
      if (t1 - t0 < 0.001) continue;
      let rate = next ? (next[1] - c0) / (t1 - t0) : (c.rate ?? last);
      if (next && Math.abs(next[1] - c0) < 1e-4) {
        // a hold: the frame at c0, frozen (a still extracted from the same source)
        out.push(`              <img id="${P}v${n}" class="clip" src="${still(prox(src), c0)}" alt="" data-start="${+t0.toFixed(3)}" data-duration="${+(t1 - t0).toFixed(3)}" data-track-index="${3 + (n % 2)}" style="z-index:${n + 1}" />`);
        n++;
        continue;
      }
      if (next && (rate < 0.0999 || rate > 10.001)) throw new Error(`clip map ${c.src}: segment ${t0}-${t1} s needs rate ${rate.toFixed(3)} (0.1-10)`);
      rate = Math.min(10, Math.max(0.1, +rate.toFixed(4)));
      last = rate;
      out.push(`              <video id="${P}v${n}" class="clip" src="${prox(src)}" data-start="${+t0.toFixed(3)}" data-duration="${+(t1 - t0).toFixed(3)}" data-media-start="${+c0.toFixed(3)}"${rate !== 1 ? ` data-playback-rate="${rate}"` : ''} data-track-index="${3 + (n % 2)}" muted playsinline style="z-index:${n + 1}"></video>`);
      n++;
    }
  } else {
    const shots = timed(p.shots || []);
    shots.forEach((s, i) => {
      const t0 = i ? s.t : 0;
      const t1 = shots[i + 1] ? shots[i + 1].t : D;
      if (!i) out.push(`              <img id="${P}s${i}" src="${s.src}" alt="" style="z-index:1" />`);
      else out.push(`              <img id="${P}s${i}" class="clip" src="${s.src}" alt="" data-start="${+t0.toFixed(3)}" data-duration="${+(D - t0).toFixed(3)}" data-track-index="${3 + (i % 2)}" style="z-index:${i + 1}" />`);
    });
  }
  return out.join('\n');
})() }}
            </div>
          </div>
{{ (() => {
  const L = __fl, keys = timed(p.cam || []);
  const sx = (u) => L.x + u * L.w, sy = (v) => L.y + L.bar + v * L.sh;
  return timed(p.focus || []).map((f, i) => {
    const z = __zAt(keys, f.t + 0.01), pad = 10 / z;
    const x = sx(f.u0) - pad, y = sy(f.v0) - pad, w = (f.u1 - f.u0) * L.w + 2 * pad, h = (f.v1 - f.v0) * L.sh + 2 * pad;
    const col = f.hot ? '255,69,58' : '255,255,255';
    return `          <div id="${P}fo${i}" class="focus" style="left:${x.toFixed(1)}px; top:${y.toFixed(1)}px; width:${w.toFixed(1)}px; height:${h.toFixed(1)}px; border-radius:${(14 / z).toFixed(1)}px; box-shadow: 0 0 0 ${(3 / z).toFixed(2)}px rgba(${col},0.95), 0 0 0 ${(10 / z).toFixed(2)}px rgba(${col},0.16), 0 ${(10 / z).toFixed(1)}px ${(40 / z).toFixed(1)}px rgba(0,0,0,0.4);" data-layout-ignore></div>`;
  }).join('\n') + '\n' + timed(p.flash || []).map((f, i) => {
    const x = sx(f.u0), y = sy(f.v0), w = (f.u1 - f.u0) * L.w, h = (f.v1 - f.v0) * L.sh;
    return `          <div id="${P}fl${i}" style="position:absolute; left:${x.toFixed(1)}px; top:${y.toFixed(1)}px; width:${w.toFixed(1)}px; height:${h.toFixed(1)}px; border-radius:${(h / 2).toFixed(1)}px; background:#fff; opacity:0; z-index:28" data-layout-ignore></div>`;
  }).join('\n');
})() }}
{{ timed(p.callouts || []).map((c, i) => `          <div id="${P}co${i}" class="callout" data-layout-allow-overflow><i id="${P}co${i}-dot" class="co-dot"></i><i id="${P}co${i}-line" class="co-line" style="${c.side === 'left' ? 'left:auto;right:0;transform-origin:100% 50%;' : ''}width:${c.len ?? 90}px"></i><div id="${P}co${i}-pill" class="co-pill glass${c.tone ? ' ' + c.tone : ''}" style="${c.side === 'left' ? 'right:' + ((c.len ?? 90) + 4) + 'px' : 'left:' + ((c.len ?? 90) + 4) + 'px'}">${c.tone === 'hot' ? '<i style="width:14px;height:14px;border-radius:50%;background:#ff3b30;flex:none"></i>' : c.tone === 'safe' ? '<i style="width:14px;height:14px;border-radius:50%;background:#30d158;flex:none"></i>' : ''}${esc(c.text)}</div></div>`).join('\n') }}
          <!--KIT:cursor-->
        </div>
        <div id="{{P}}over">
{{ p.keys ? (p.keys.labels || ['⌘', '↵']).map((k, i, all) => { const n = all.length, gap = 26, w = 176, x0 = 960 - (n * w + (n - 1) * gap) / 2; return `          <div id="${P}key${i}" class="keycap" style="left:${x0 + i * (w + gap)}px; top:${p.keys.y ?? 640}px">${esc(k)}</div>`; }).join('\n') : '' }}
{{ p.tag ? `          <div id="${P}tag" class="tag glass pill${p.tagHot ? ' hot' : ''}"><i></i>${esc(p.tag)}</div>` : '' }}
        </div>
      </div></div>
      <!--KIT:fx-->
    </div>
  </div>
  <script>
    (function () {
      /*KIT*/
      const P = '#{{P}}', S = {{json(S)}}, p = {{json(timed(p))}};
      const L = {{json(__fl)}};
      const ctx = { screen: { x: L.x, y: L.y + L.bar, w: L.w, h: L.sh } };
      const tl = gsap.timeline({ paused: true });
      const keys = (p.cam && p.cam.length ? p.cam : [{ t: 0, home: true }]).map((k) => ({ ...k, fy: k.fy ?? (k.home ? undefined : 500) }));
      // the frame rect of a footage rect at local time t (camera keys are complete by then)
      const camAt = (t) => { let k = keys[0]; for (const x of keys) if (x.t <= t + 1e-6) k = x; return K.camState(k, ctx); };
      const frameRect = (r, t) => {
        const c = camAt(t), s = c.scale;
        const x0 = c.x + s * (ctx.screen.x + r.u0 * ctx.screen.w), y0 = c.y + s * (ctx.screen.y + r.v0 * ctx.screen.h);
        const x1 = c.x + s * (ctx.screen.x + r.u1 * ctx.screen.w), y1 = c.y + s * (ctx.screen.y + r.v1 * ctx.screen.h);
        return [x0, y0, x1 - x0, y1 - y0, (r.r ?? 16) * s];
      };
      if (S.out && S.out.type === 'zoom' && S.out.target) S.out = { ...S.out, rect: frameRect(S.out.target, S.cut - (S.out.dur ?? 0.36)) };
      const c0 = camAt(0);
      const devRect = [c0.x + c0.scale * L.x, c0.y + c0.scale * L.y, c0.scale * L.w, c0.scale * L.h, 28 * c0.scale];
      K.scene(tl, P, S, { morph: { to: p.morphTo || devRect, target: P + 'dev', fit: 'cover', blur: false, out: [P + 'dev', P + 'over'] } });
      if (S.in.type !== 'morph' && S.in.type !== 'zoom' && S.in.type !== 'whip' && S.in.type !== 'iris' && S.in.type !== 'cut') K.land(tl, P + 'dev', 0, { from: 0.97, blur: 8, dur: 0.7 });
      K.cam(tl, P + 'cam', keys, ctx);
      // focus rings
      (p.focus || []).forEach((f, i) => K.focus(tl, P + 'fo' + i, f.t, f.until ?? S.cut - 0.12));
      (p.flash || []).forEach((f, i) => {
        tl.fromTo(P + 'fl' + i, { opacity: 0 }, { opacity: 0.32, duration: 0.05, ease: 'none' }, f.t);
        tl.to(P + 'fl' + i, { opacity: 0, duration: 0.22, ease: 'power2.out' }, f.t + 0.06);
      });
      // callouts: anchored to footage points, drawn at a constant on-screen size whatever the camera scale
      (p.callouts || []).forEach((c, i) => {
        const id = P + 'co' + i, el = document.querySelector(id);
        el.style.left = ctx.screen.x + c.u * ctx.screen.w + 'px';
        el.style.top = ctx.screen.y + c.v * ctx.screen.h + 'px';
        const s = 1 / K.camScaleAt(keys, c.t + 0.01);
        tl.set(id, { scale: s, opacity: 1 }, 0);
        tl.fromTo(id + '-dot', { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: 'back.out(2)' }, c.t);
        tl.fromTo(id + '-line', { scaleX: 0 }, { scaleX: 1, duration: 0.24, ease: 'power3.out' }, c.t + 0.08);
        tl.fromTo(id + '-pill', { opacity: 0, filter: 'blur(8px)' }, { opacity: 1, filter: 'blur(0px)', duration: 0.22, ease: 'power2.out' }, c.t + 0.18);
        tl.to([id + '-dot', id + '-line', id + '-pill'], { opacity: 0, duration: 0.18, ease: 'power2.in' }, c.until ?? S.cut - 0.3);
      });
      // the cursor (stills only)
      if (p.cursor && document.querySelector(P + 'cursor')) {
        const s = 1 / K.camScaleAt(keys, p.cursor[Math.min(1, p.cursor.length - 1)].t + 0.01);
        tl.set(P + 'cursor', { scale: s }, 0);
        K.cursor(tl, P + 'cursor', p.cursor.map((k) => ({ ...k, x: ctx.screen.x + k.u * ctx.screen.w, y: ctx.screen.y + k.v * ctx.screen.h })));
        tl.set(P + 'cursor', { opacity: 0 }, 0);
        p.cursor.forEach((k) => { if (k.hide) tl.fromTo(P + 'cursor', { opacity: 1 }, { opacity: 0, duration: 0.18, ease: 'power2.in', immediateRender: false }, k.t - 0.18); });
        tl.fromTo(P + 'cursor', { opacity: 0 }, { opacity: 1, duration: 0.2, ease: 'power1.out', immediateRender: false }, Math.max(0, p.cursor[0].t));
      }
      // keycaps: land (glass drops in from depth), press on the beat
      if (p.keys) {
        (p.keys.labels || ['⌘', '↵']).forEach((k, i) => {
          tl.fromTo(P + 'key' + i, { opacity: 0, scale: 0.86, filter: 'blur(10px)' }, { opacity: 1, scale: 1, filter: 'blur(0px)', duration: 0.42, ease: 'expo.out' }, p.keys.at + i * 0.07);
          K.press(tl, P + 'key' + i, p.keys.t);
        });
      }
      if (p.tag) {
        K.blurLine(tl, P + 'tag', p.tagAt ?? 0.3);
        if (p.tagUntil !== undefined) K.out(tl, P + 'tag', p.tagUntil);
      }
      window.__timelines['{{ID}}'] = tl;
    })();
  </script>
</template>
