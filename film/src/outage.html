          <div id="{{P}}sbar"><span class="clock">2:14</span>
            <span id="{{P}}net1" class="net">5G <span class="bars"><b style="height:6px"></b><b style="height:10px"></b><b style="height:14px"></b><b style="height:19px"></b></span></span>
            <span id="{{P}}net2" class="net" style="opacity:0"><span id="{{P}}nosvc">No Service</span></span>

            <div class="av">IB</div>
            <div class="nm">Incident bridge</div>
            <div class="st"><span id="{{P}}st1" style="color: var(--ink-3)">calling…</span><span id="{{P}}st2" style="color: #ff453a; opacity: 0">Call failed</span></div>

          <div id="{{P}}grid">
{{ ['Finance', 'Legal', 'Payroll', 'Contracts', 'Board', 'Audit'].map((n, i) => `            <div id="${P}t${i}" class="tile"><i class="lk"></i><div class="ic"><span class="fo">${'<!--ICON-->'}</span></div><div class="tn">${n}<em>.locked</em></div><div class="tm" data-layout-ignore>${[412, 233, 96, 588, 41, 170][i]} files</div></div>`).join('\n').replace(/<span class="fo"><!--ICON--><\/span>/g, '<span class="fo"><svg class="ico" width="58" height="58" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3.6 7.2a2.2 2.2 0 0 1 2.2-2.2h3.9l2 2.2h6.5a2.2 2.2 0 0 1 2.2 2.2v7.8a2.2 2.2 0 0 1-2.2 2.2H5.8a2.2 2.2 0 0 1-2.2-2.2z"/></svg></span><span class="lock"><svg class="ico" width="58" height="58" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="5.2" y="10.6" width="13.6" height="9.4" rx="3"/><path d="M8.6 10.6V8.2a3.4 3.4 0 0 1 6.8 0v2.4"/></svg></span>') }}

  <script>
    (function () {
      /*KIT*/
      const P = '#{{P}}', S = {{json(S)}};
      const tl = gsap.timeline({ paused: true });
      K.scene(tl, P, S, { morph: { to: [330, 110, 420, 860, 76], target: P + 'phone' } });
      // the call fails on "down"
      const down = {{at('down')}};
      tl.to(P + 'st1', { opacity: 0, filter: 'blur(6px)', duration: 0.14, ease: 'power2.in' }, down - 0.06);
      tl.fromTo(P + 'st2', { opacity: 0, filter: 'blur(6px)' }, { opacity: 1, filter: 'blur(0px)', duration: 0.18, ease: 'power2.out' }, down + 0.06);
      tl.to(P + 'net1', { opacity: 0, duration: 0.12, ease: 'power2.in' }, down - 0.04);
      tl.fromTo(P + 'net2', { opacity: 0 }, { opacity: 1, duration: 0.16, ease: 'power2.out' }, down + 0.08);
      tl.fromTo(P + 'end', { scale: 1 }, { scale: 0.9, duration: 0.08, ease: 'power2.out' }, down);
      tl.to(P + 'end', { scale: 1, duration: 0.24, ease: 'power2.out' }, down + 0.09);
      // the file share lands, then ransomware locks it folder by folder
      const rw = {{at('Ransomware')}};
      K.land(tl, P + 'share', rw - 0.4, { from: 0.94, blur: 12, dur: 0.6 });
      for (let i = 0; i < 6; i++) {
        const t = rw + 0.22 + i * 0.12, s = P + 't' + i;
        tl.fromTo(s + ' .lk', { opacity: 0 }, { opacity: 1, duration: 0.18, ease: 'power2.out' }, t);
        tl.to(s + ' .fo', { opacity: 0, duration: 0.12, ease: 'power2.in' }, t);
        tl.fromTo(s + ' .lock', { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.3, ease: 'back.out(2)' }, t + 0.04);
        tl.fromTo(s + ' .tn em', { opacity: 0 }, { opacity: 1, duration: 0.16, ease: 'power1.out' }, t + 0.08);
      }
      K.land(tl, P + 'banner', {{at('has the file share')}} - 0.05, { from: 0.9, blur: 10, dur: 0.5 });
      window.__timelines['{{ID}}'] = tl;
    })();
