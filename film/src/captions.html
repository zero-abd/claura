<template>
  <!-- Word-synced captions, generated by tools/build.mjs from the VO timings (film.config.mjs: captions).
       Apple-style: bottom, inside title-safe, one line of <= 6 words, the current word lit by a soft glass lozenge. -->
  <style>
    /*COMMON*/
    #cap-band { position: absolute; left: 192px; right: 192px; bottom: 112px; height: 66px; }
    .cap-g { position: absolute; left: 0; right: 0; bottom: 0; text-align: center; white-space: nowrap; opacity: 0; }
    .cap-w { position: relative; display: inline-block; font: 600 40px/66px var(--font); letter-spacing: -0.012em; color: rgba(247, 249, 255, 0.62);
      text-shadow: 0 2px 14px rgba(0, 0, 0, 0.7), 0 0 3px rgba(0, 0, 0, 0.55); }
    .cap-w b { position: absolute; left: -9px; right: -9px; top: 9px; bottom: 9px; border-radius: 12px; opacity: 0; z-index: -1;
      background: rgba(255, 255, 255, 0.16); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.28), 0 4px 14px rgba(0, 0, 0, 0.25); }
  </style>
  <div id="root" data-composition-id="captions" data-width="1920" data-height="1080" style="background: transparent">
    <div id="cap-band">
{{ CAPS.map((g, i) => `      <div id="cap-g${i}" class="cap-g">` + g.words.map((w, k) => `<span id="cap-w${i}-${k}" class="cap-w"><b></b>${esc(w.text)}</span>`).join(' ') + `</div>`).join('\n') }}
    </div>
  </div>
  <script>
    (function () {
      const G = {{ json(CAPS.map((g) => [g.start, g.end, g.words.map((w) => [w.s, w.e])])) }};
      const tl = gsap.timeline({ paused: true });
      const DIM = 'rgba(247,249,255,0.62)', LIT = 'rgba(247,249,255,1)';
      G.forEach(([s, e, ws], i) => {
        const g = '#cap-g' + i;
        tl.fromTo(g, { opacity: 0 }, { opacity: 1, duration: 0.1, ease: 'power1.out' }, s);
        ws.forEach(([a, b], k) => {
          const w = '#cap-w' + i + '-' + k;
          tl.fromTo(w, { color: DIM }, { color: LIT, duration: 0.08, ease: 'none' }, a);
          tl.fromTo(w + ' b', { opacity: 0 }, { opacity: 1, duration: 0.06, ease: 'none' }, a);
          tl.to(w + ' b', { opacity: 0, duration: 0.08, ease: 'none' }, Math.max(a + 0.07, b - 0.04));
        });
        tl.to(g, { opacity: 0, duration: 0.1, ease: 'power1.in' }, Math.max(s + 0.1, e - 0.1));
        tl.set(g, { opacity: 0, visibility: 'hidden' }, e);
      });
      window.__timelines['captions'] = tl;
    })();
  </script>
</template>
