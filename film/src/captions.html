<template>
  <!-- Word-synced captions, generated by tools/build.mjs from the VO timings (film.config.mjs: captions).
       Apple-style: bottom, inside title-safe, one line of <= 6 words on a dark glass scrim sized to the text; each word lights as it is spoken. -->
  <style>
    /*COMMON*/
    #cap-band { position: absolute; left: 192px; right: 192px; bottom: 96px; height: 76px; }
    .cap-g { position: absolute; left: 0; right: 0; bottom: 0; text-align: center; white-space: nowrap; opacity: 0; }
    .cap-in { display: inline-block; padding: 0 26px; border-radius: 20px; word-spacing: 0.14em; background: rgba(8, 8, 8, 0.58);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12), 0 8px 24px rgba(0, 0, 0, 0.25); }
    .cap-w { display: inline-block; font: 600 46px/76px var(--font); letter-spacing: -0.014em; color: rgba(249, 249, 249, 0.6); }
  </style>
  <div id="root" data-composition-id="captions" data-width="1920" data-height="1080" style="background: transparent">
    <div id="cap-band">
{{ CAPS.map((g, i) => `      <div id="cap-g${i}" class="cap-g"><span class="cap-in">` + g.words.map((w, k) => `<span id="cap-w${i}-${k}" class="cap-w">${esc(w.text)}</span>`).join(' ') + `</span></div>`).join('\n') }}
    </div>
  </div>
  <script>
    (function () {
      const G = {{ json(CAPS.map((g) => [g.start, g.end, g.words.map((w) => [w.s, w.e])])) }};
      const tl = gsap.timeline({ paused: true });
      const DIM = 'rgba(249,249,249,0.62)', LIT = 'rgba(249,249,249,1)';
      G.forEach(([s, e, ws], i) => {
        const g = '#cap-g' + i;
        tl.fromTo(g, { opacity: 0 }, { opacity: 1, duration: 0.1, ease: 'power1.out' }, s);
        ws.forEach(([a, b], k) => {
          const w = '#cap-w' + i + '-' + k;
          tl.fromTo(w, { color: DIM }, { color: LIT, duration: 0.08, ease: 'none' }, a);
        });
        tl.to(g, { opacity: 0, duration: 0.1, ease: 'power1.in' }, Math.max(s + 0.1, e - 0.1));
        tl.set(g, { opacity: 0, visibility: 'hidden' }, e);
      });
      window.__timelines['captions'] = tl;
    })();
  </script>
</template>
