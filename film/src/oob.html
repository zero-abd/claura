  <script>
    (function () {
      /*KIT*/
      const P = '#{{P}}', S = {{json(S)}};
      const tl = gsap.timeline({ paused: true });
      K.scene(tl, P, S);
      // the pane builds around the mark that just arrived
      tl.fromTo(P + 'cmd', { opacity: 0, scale: 0.94, transformOrigin: '86px 82px' }, { opacity: 1, scale: 1, duration: 0.6, ease: 'expo.out' }, 0.04);
      K.blurWords(tl, P + 'ct', 0, { times: {{json(times('command center'))}} });
      K.blurLine(tl, P + 'cs', {{at('runs outside')}});
      K.land(tl, P + 'oobl', {{at('outside')}} + 0.05, { from: 0.9, blur: 8, dur: 0.45 });
      // the compromised network, beside it, not around it
      const outside = {{at('outside')}};
      K.land(tl, P + 'net', outside - 0.18, { from: 0.95, blur: 12, dur: 0.6 });
      for (let i = 0; i < 4; i++) K.land(tl, P + 't' + i, outside + 0.02 + i * 0.07, { from: 0.94, blur: 8, dur: 0.45 });
      K.pop(tl, P + 'comp', {{at('your network')}});
      K.land(tl, P + 'agents', outside + 0.5, { from: 0.9, blur: 8, dur: 0.45 });
      // its own identities
      const ids = {{at('with its own identities')}};
      for (let i = 0; i < 3; i++) K.land(tl, P + 'id' + i, ids - 0.42 + i * 0.07, { from: 0.96, blur: 8, dur: 0.4 });
      window.__timelines['{{ID}}'] = tl;
    })();
