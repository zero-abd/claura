       track line follow; then it holds. -->

    #{{P}}lock { position: absolute; left: 803.8px; top: 400px; width: 312.4px; height: 102.7px; }
    #{{P}}lmark { position: absolute; left: 0; top: 0; width: 96.7px; height: 102.7px; overflow: visible; }
    #{{P}}lword { position: absolute; left: 123.3px; top: 0; width: 189.2px; height: 102.7px; overflow: visible; }
    #{{P}}tagline { position: absolute; left: 0; right: 0; top: 566px; text-align: center; white-space: nowrap; font: 600 66px/1.1 var(--font); letter-spacing: -0.034em; }

  <div id="root" data-composition-id="{{ID}}" data-width="1920" data-height="1080">
    <div id="{{P}}stage" class="stage">
      <!--KIT:wallpaper-->
      <div id="{{P}}whip" class="whip"><div id="{{P}}settle" class="settle"><div id="{{P}}cam" class="cam">
        <img id="{{P}}icon" src="assets/brand/app-icon-1024.png" alt="Claura app icon" />
        <div id="{{P}}lock" aria-label="Claura">
          <svg id="{{P}}lmark" viewBox="24 17 209 222"><path fill="#E5E5EA" d="M231.95 73.95A111 111 0 1 0 231.95 182.05A7.64 7.64 0 0 0 219.1 173.85A78 78 0 1 1 219.1 82.15A7.64 7.64 0 0 0 231.95 73.95Z" /><path fill="#FF3B30" d="M108 128a48 48 0 1 0 96 0a48 48 0 1 0-96 0z" /></svg>

        <div id="{{P}}tagline">{{ words('Your network is compromised. Your command *isn’t.*') }}</div>

          <span id="{{P}}u0" class="u glass pill">claura.tech</span>
          <span id="{{P}}u1" class="u glass pill"><svg class="ico" width="30" height="30" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2.2a9.8 9.8 0 0 0-3.1 19.1c.5.1.7-.2.7-.5v-1.7c-2.7.6-3.3-1.3-3.3-1.3-.4-1.1-1.1-1.4-1.1-1.4-.9-.6.1-.6.1-.6 1 .1 1.5 1 1.5 1 .9 1.5 2.3 1.1 2.9.8.1-.6.3-1.1.6-1.3-2.2-.3-4.5-1.1-4.5-4.9 0-1.1.4-2 1-2.7-.1-.3-.4-1.3.1-2.7 0 0 .8-.3 2.7 1a9.4 9.4 0 0 1 4.9 0c1.9-1.3 2.7-1 2.7-1 .5 1.4.2 2.4.1 2.7.6.7 1 1.6 1 2.7 0 3.8-2.3 4.6-4.5 4.9.4.3.7.9.7 1.9v2.8c0 .3.2.6.7.5A9.8 9.8 0 0 0 12 2.2z"/></svg>github.com/zero-abd/claura</span>

        <div id="{{P}}track">HackUTD 2026</div>
      </div></div></div>
      <!--KIT:fx-->
    </div>
  </div>
  <script>
    (function () {
      /*KIT*/
      const P = '#{{P}}', S = {{json(S)}};
      const tl = gsap.timeline({ paused: true });
      // the app icon's body (824 of 1024) is the morph target
      K.scene(tl, P, S, { morph: { to: [847.4, 123.4, 225.3, 225.3, 52], target: P + 'icon' } });
      const bar = {{cue('bar')}};
      if (S.in.type !== 'morph') K.land(tl, P + 'icon', bar - 0.3, { from: 0.86, blur: 14, dur: 0.6 });
      // land on the bar: a small settle that ends on the downbeat
      tl.fromTo(P + 'icon', { scale: 1.06 }, { scale: 1, duration: 0.5, ease: 'expo.out', immediateRender: false }, bar - 0.05);
      // the lockup: mark, then the wordmark wipes in
      K.land(tl, P + 'lmark', bar + 0.08, { from: 0.8, blur: 8, dur: 0.5 });
      tl.fromTo(P + 'lword', { clipPath: 'inset(0% 100% 0% 0%)' }, { clipPath: 'inset(0% 0% 0% 0%)', duration: 0.6, ease: 'power3.out' }, bar + 0.2);
      // the tagline on the voice
      K.blurWords(tl, P + 'tagline', 0, { times: {{json(times('Your network is compromised. Your command isn’t.'))}} });
      const urls = {{end('Your command isn’t')}} + 0.25;
      K.land(tl, P + 'u0', urls, { from: 0.9, blur: 8, dur: 0.5 });
      K.land(tl, P + 'u1', urls + 0.1, { from: 0.9, blur: 8, dur: 0.5 });
      K.blurLine(tl, P + 'track', urls + 0.35);
      window.__timelines['{{ID}}'] = tl;
    })();
  </script>
