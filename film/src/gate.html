<template>
  <!-- 12. "Our red-team probe tries to reimage the host. Denied." A glass diagram (no product screen claims to show this):
       the probe's proposal travels into the policy gate, the gate lights, the action behind it stays locked
       ("High-impact steps never run unattended", the playbook's own words) and DENIED slams onto the card. -->
  <style>
    /*COMMON*/
    #{{P}}gate { left: 1100px; top: 190px; width: 76px; height: 620px; border-radius: 38px; box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.12), 0 30px 60px -20px rgba(0, 0, 0, 0.6); }
    #{{P}}gate .hot { position: absolute; inset: 0; border-radius: inherit; opacity: 0; background: linear-gradient(180deg, rgba(255, 81, 71, 0.95), rgba(255, 59, 48, 0.75)); box-shadow: 0 0 0 1.5px rgba(255, 128, 120, 0.7); }
    #{{P}}gl1 { position: absolute; left: 938px; width: 400px; top: 118px; text-align: center; font: 600 38px/1 var(--font); letter-spacing: -0.022em; white-space: nowrap; }
    #{{P}}gl2 { position: absolute; left: 888px; width: 500px; top: 838px; text-align: center; font: 500 28px/1 var(--font); color: var(--ink-3); white-space: nowrap; }
    #{{P}}src { left: 110px; top: 300px; height: 80px; padding: 0 32px 0 22px; font-size: 34px; gap: 14px; }
    #{{P}}card { left: 110px; top: 420px; width: 600px; height: 176px; padding: 40px 44px 0; }
    #{{P}}card .c1 { font: 600 40px/1 var(--font); letter-spacing: -0.02em; white-space: nowrap; }
    #{{P}}card .c2 { margin-top: 20px; font: 500 30px/1 var(--font); color: var(--ink-3); white-space: nowrap; }
    #{{P}}act { left: 1250px; top: 400px; width: 560px; height: 196px; padding: 38px 42px 0; }
    #{{P}}act .a1 { display: flex; align-items: center; gap: 14px; font: 600 38px/1 var(--font); letter-spacing: -0.02em; color: var(--ink-2); white-space: nowrap; }
    #{{P}}act .a2 { margin-top: 20px; font: 500 30px/1.25 var(--font); color: var(--ink-3); }
    #{{P}}stamp { left: 196px; top: 452px; height: 112px; font-size: 64px; }
  </style>
  <div id="root" data-composition-id="{{ID}}" data-width="1920" data-height="1080">
    <div id="{{P}}stage" class="stage">
      <!--KIT:wallpaper-->
      <div id="{{P}}whip" class="whip"><div id="{{P}}settle" class="settle"><div id="{{P}}cam" class="cam">
        <div id="{{P}}gl1">Policy gate</div>
        <div id="{{P}}gl2">playbook guest-escape v3</div>
        <div id="{{P}}gate" class="glass clear"><i id="{{P}}gatehot" class="hot"></i><div id="{{P}}glock" style="position:absolute; left:8px; top:280px; width:60px; height:60px; border-radius:50%; display:grid; place-items:center; color:#fff; background:rgba(255,255,255,0.16)"><!--KIT:icon name="lock" size=34 stroke=1.9--></div></div>
        <div id="{{P}}act" class="glass">
          <div class="a1"><!--KIT:icon name="lock" size=36 stroke=1.8-->Reimage host</div>
          <div id="{{P}}a2" class="a2">Needs a human. High-impact steps never run unattended.</div>
        </div>
        <div id="{{P}}src" class="chip glass pill"><!--KIT:icon name="probe" size=36 stroke=1.8-->Red-team probe</div>
        <div id="{{P}}cardw" style="position:absolute; left:0; top:0">
          <div id="{{P}}card" class="glass thick">
            <div id="{{P}}cin">
              <div class="c1">reimage_host(b14-gpu-07)</div>
              <div class="c2">Wipes disks and firmware state</div>
            </div>
          </div>
          <div id="{{P}}stamp" class="stamp" data-layout-allow-overlap data-layout-allow-occlusion><!--KIT:icon name="x" size=56 stroke=2.6-->Denied</div>
        </div>
      </div></div></div>
      <!--KIT:fx-->
    </div>
  </div>
  <script>
    (function () {
      /*KIT*/
      const P = '#{{P}}', S = {{json(S)}};
      const tl = gsap.timeline({ paused: true });
      K.scene(tl, P, S, { morph: { out: [P + 'src', P + 'gate', P + 'gl1', P + 'gl2', P + 'act'], inner: [P + 'cin', P + 'stamp'] } });
      // the gate and what it guards are already standing when we arrive (the zoom lands on them)
      K.blurLine(tl, P + 'gl1', 0.05);
      K.blurLine(tl, P + 'gl2', 0.15);
      // the probe, then its proposal, which runs at the gate and stops dead
      K.land(tl, P + 'src', {{at('red-team probe')}} - 0.2, { from: 0.9, blur: 10, dur: 0.5 });
      const go = {{at('tries')}} - 0.05, hit = {{at('the host')}} - 0.05;
      K.land(tl, P + 'card', {{at('probe')}} - 0.05, { from: 0.92, blur: 10, dur: 0.45 });
      tl.fromTo(P + 'card', { x: 0 }, { x: 382, duration: hit - go, ease: 'power2.in', immediateRender: false }, go);
      tl.fromTo(P + 'card', { x: 382 }, { x: 336, duration: 0.34, ease: 'power3.out', immediateRender: false }, hit);
      tl.fromTo(P + 'gatehot', { opacity: 0 }, { opacity: 1, duration: 0.08, ease: 'power2.out' }, hit);
      tl.to(P + 'gatehot', { opacity: 0.55, duration: 0.7, ease: 'power2.out' }, hit + 0.1);
      tl.fromTo(P + 'a2', { color: '#6e6e73' }, { color: '#ff9f0a', duration: 0.2, ease: 'power1.out' }, hit + 0.05);
      // DENIED, on the word
      tl.set(P + 'stamp', { x: 336 }, 0);
      K.stamp(tl, P + 'stamp', {{at('Denied')}} + 0.02, { rot: -6, shake: P + 'cardw' });
      window.__timelines['{{ID}}'] = tl;
    })();
  </script>
</template>
