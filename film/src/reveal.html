<template>
  <!-- 7. DROP. "This is Claura, the immune system for AI data centers." The orb lands where the fragments collapsed,
       the C sweeps around it, the world lights up behind it (light on the ground, never a glow on the logo), the mark
       makes room and the wordmark wipes in; the line lands word by word on the voice. The mark then carries into the
       command-centre pane of the next scene (params.markTo). Brand paths: claura-brand/logo.svg, lockup-dark.svg. -->
  <style>
    /*COMMON*/
    #{{P}}lock { position: absolute; left: 640.4px; top: 435px; width: 639.1px; height: 210px; }
    #{{P}}mark { position: absolute; left: 0; top: 0; width: 197.7px; height: 210px; overflow: visible; }
    #{{P}}word { position: absolute; left: 252.2px; top: 0; width: 386.9px; height: 210px; overflow: visible; }
    #{{P}}sub { position: absolute; left: 0; right: 0; top: 712px; text-align: center; font: 500 50px/1.2 var(--font); letter-spacing: -0.022em; color: var(--ink-2); white-space: nowrap; }
  </style>
  <div id="root" data-composition-id="{{ID}}" data-width="1920" data-height="1080">
    <div id="{{P}}stage" class="stage">
      <!--KIT:wallpaper-->
      <div id="{{P}}whip" class="whip"><div id="{{P}}settle" class="settle"><div id="{{P}}cam" class="cam">
        <div id="{{P}}lock" aria-label="Claura">
          <svg id="{{P}}mark" viewBox="24 17 209 222">
            <defs>
              <mask id="{{P}}sweep" maskUnits="userSpaceOnUse" x="0" y="0" width="256" height="256">
                <circle id="{{P}}sweepc" cx="156" cy="128" r="104" fill="none" stroke="#fff" stroke-width="74" stroke-dasharray="660 700" stroke-dashoffset="660" />
              </mask>
            </defs>
            <path id="{{P}}ring" fill="#FF5A1F" mask="url(#{{P}}sweep)" d="M231.95 73.95A111 111 0 1 0 231.95 182.05A7.64 7.64 0 0 0 219.1 173.85A78 78 0 1 1 219.1 82.15A7.64 7.64 0 0 0 231.95 73.95Z" />
            <path id="{{P}}seal" fill="#FF5A1F" d="M108 128a48 48 0 1 0 96 0a48 48 0 1 0-96 0z" />
          </svg>
          <svg id="{{P}}word" viewBox="290.6 17 409 222"><path fill="#FFFFFF" transform="translate(290.61 179.06) scale(1.4038)" d="<!--KIT:wordpath-->" /></svg>
        </div>
        <div id="{{P}}sub" class="t-lead">{{ words('The immune system for AI data centers') }}</div>
      </div></div></div>
      <!--KIT:fx-->
    </div>
  </div>
  <script>
    (function () {
      /*KIT*/
      const P = '#{{P}}', S = {{json(S)}}, p = {{json(p)}};
      const tl = gsap.timeline({ paused: true });
      K.scene(tl, P, S);
      const drop = {{cue('drop')}}, name = {{at('Claura')}};
      // the orb lands with weight where the fragments met (frame centre), the C sweeps round it
      tl.set(P + 'mark', { x: 194.7, transformOrigin: '0 0' }, 0);
      tl.fromTo(P + 'seal', { scale: 0.28, svgOrigin: '156 128' }, { scale: 1.07, svgOrigin: '156 128', duration: 0.16, ease: 'power3.out' }, drop);
      tl.to(P + 'seal', { scale: 1, svgOrigin: '156 128', duration: 0.42, ease: 'power2.inOut' }, drop + 0.16);
      tl.fromTo(P + 'sweepc', { attr: { 'stroke-dashoffset': 660 } }, { attr: { 'stroke-dashoffset': 0 }, duration: 0.62, ease: 'power3.out' }, drop + 0.05);
      tl.fromTo(P + 'settle', { scale: 1.035 }, { scale: 1, duration: 0.7, ease: 'expo.out' }, drop);
      // the world answers: light blooms on the ground behind the mark, then settles
      tl.fromTo(P + 'wp-spot', { opacity: 0 }, { opacity: 1, duration: 0.1, ease: 'power2.out' }, drop);
      tl.to(P + 'wp-spot', { opacity: 0.42, duration: 1.6, ease: 'power2.out' }, drop + 0.12);
      // the mark makes room; the wordmark wipes in beside it
      tl.fromTo(P + 'mark', { x: 194.7 }, { x: 0, duration: 0.7, ease: 'power3.inOut', immediateRender: false }, name - 0.12);
      tl.fromTo(P + 'word', { clipPath: 'inset(0% 100% 0% 0%)', filter: 'blur(6px)' }, { clipPath: 'inset(0% 0% 0% 0%)', filter: 'blur(0px)', duration: 0.62, ease: 'power3.out' }, name + 0.1);
      // the line, word by word on the voice
      K.blurWords(tl, P + 'sub', 0, { times: {{json(times('the immune system for AI data centers'))}} });
      // carry: the mark shrinks into the next scene's command pane; everything else leaves
      const m = p.markTo, out = S.cut - 0.45;
      tl.to(P + 'mark', { x: m.x - 640.4, y: m.y - 435, scale: m.h / 210, duration: 0.45, ease: 'power3.inOut' }, out);
      K.out(tl, P + 'word', out, { dur: 0.2 });
      K.out(tl, P + 'sub', S.cut - 0.22, { dur: 0.2 });
      tl.to(P + 'wp-spot', { opacity: 0, duration: 0.5, ease: 'power2.inOut' }, out);
      window.__timelines['{{ID}}'] = tl;
    })();
  </script>
</template>
