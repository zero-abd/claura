    (function () {
      const P = '#{{P}}';

      for (let i = 1; i < CAMS.length; i++) {
        const [t, x, y, z, d] = CAMS[i];
        tl.to(P + 'cam', { ...camAt(x, y, z), duration: d ?? 0.55, ease: 'power2.inOut' }, t);
      }
      spray(P + 'agent', 0.1, 0.25);
      spray(P + 'verb', 0.3, 0.25);
